name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # Executa a cada 12 horas
  workflow_dispatch: # Permite execução manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2 # Faz o checkout do seu repositório

      # Usa a ação Platane/snk@master
      # NOTA: Usamos 'svg_out_path' porque o erro anterior indicou que 'outputs' era inválido
      - uses: Platane/snk@master # <<<<<<<<<<<<<< Voltamos para @master
        id: snake-gif
        with:
          github_user_name: WesleyAssiss # Seu nome de usuário do GitHub
          svg_out_path: dist/github-contribution-grid-snake.svg # <<<<<<<<<<<<<< Usando svg_out_path

      # Este passo é crucial para garantir que a pasta 'dist' exista
      # e para copiar o SVG gerado para os nomes que você usa no README.md.
      - name: Create themed snake files and ensure dist
        run: |
          mkdir -p dist # Garante que a pasta 'dist' existe, se a ação anterior não a criou
          # A ação 'Platane/snk' com 'svg_out_path' já deve ter colocado o arquivo em dist/
          # Agora, vamos copiar esse arquivo para os nomes específicos que você usa no README.md
          cp dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg
          cp dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake.circular.svg

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output # A branch onde a cobrinha será salva
          build_dir: dist       # O diretório que contém os arquivos gerados
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
