name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch: # Allows manual execution

permissions:
  contents: write # Adiciona permissão de escrita para o workflow

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: WesleyAssiss # Use o nome de usuário explicitamente
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=30a2ff,5e81f4,8257e5,d284ff
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=30a2ff,5e81f4,8257e5,d284ff

      - name: Ensure dist directory and copy files
        run: |
          echo "=== Conteúdo do diretório de trabalho ANTES de qualquer operação no dist ==="
          ls -la
          echo "=== Criando diretório dist (se não existir) ==="
          mkdir -p dist
          echo "=== Conteúdo do diretório dist APÓS Platane/snk (ANTES da cópia) ==="
          ls -la dist/
          if [ -f "dist/github-contribution-grid-snake.svg" ]; then
            echo "Arquivo 'dist/github-contribution-grid-snake.svg' ENCONTRADO. Copiando para 'dist/github-contribution-grid-snake.circular.svg'..."
            cp dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake.circular.svg
            echo "Cópia concluída."
          else
            echo "ERRO: Arquivo 'dist/github-contribution-grid-snake.svg' NÃO FOI ENCONTRADO. Não foi possível copiar."
          fi
          echo "=== Conteúdo do diretório dist APÓS a tentativa de cópia ==="
          ls -la dist/

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
