name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch: # Allows manual execution

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }} # Or your specific username: WesleyAssiss
          # Apply the colors from your README directly here
          # Format: outputs: <output_path>?<options>&<option2>
          # The colors are from your original README: color_1=30a2ff&color_2=5e81f4&color_3=8257e5&color_4=d284ff
          # We'll use color_snake for the snake body, and combine your colors.
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=30a2ff,5e81f4,8257e5,d284ff
            # If you want the dark version to have different snake colors, you can specify them:
            # dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=another,set,of,colors
            # For now, the cp command will make them identical to the base one.

      # This step ensures the 'dist' directory exists (though Platane/snk should create it)
      # and copies the generated SVG for the different names used in your README.
      - name: Create themed snake files and ensure dist
        run: |
          mkdir -p dist 
          # Copy the base (now colored) snake SVG to the other names
          # The Platane/snk action with the 'outputs' above should have already created dist/github-contribution-grid-snake.svg
          # If it didn't, the workflow would likely fail at the 'Platane/snk' step.
          cp dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg
          cp dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake.circular.svg

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output # The branch where the snake will be saved
          build_dir: dist       # The directory that contains the generated files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
