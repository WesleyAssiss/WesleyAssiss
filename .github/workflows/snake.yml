name: Generate Snake

on:
  schedule: # Executa a cada 12 horas (pode ajustar para 24 se preferir)
    - cron: "0 */12 * * *"
  workflow_dispatch: # Permite execução manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2 # Faz o checkout do seu repositório
      - uses: Platane/snk@master # Usa a ação Platane/snk
        id: snake-gif
        with:
          github_user_name: WesleyAssiss # Seu nome de usuário do GitHub
          # Caminhos de saída para os SVGs (agora com o parâmetro correto 'svg_out_path')
          svg_out_path: dist/github-contribution-grid-snake.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Este passo renomeia a cobrinha circular e a cobrinha escura se você quiser usá-las
      - name: Create themed snake files
        run: |
          mv dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake.svg # Mantém o padrão
          cp dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg # Copia e pode ser tematizado via URL
          cp dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake.circular.svg # Copia e pode ser tematizado via URL e formato

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output # A branch onde a cobrinha será salva
          build_dir: dist       # O diretório que contém os arquivos gerados
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
