name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch: # Allows manual execution

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=30a2ff,5e81f4,8257e5,d284ff
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=30a2ff,5e81f4,8257e5,d284ff

      - name: Create themed snake files and ensure dist
        run: |
          mkdir -p dist
          cp dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake.circular.svg

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
