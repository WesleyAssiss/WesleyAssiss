name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # Executa a cada 12 horas
  workflow_dispatch: # Permite execução manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2 # Checkout do seu repositório

      # Usa a ação Platane/snk na versão v0.1.0
      # O output será diretamente o SVG no caminho especificado
      - uses: Platane/snk@v0.1.0 # <<<<<<<<<<<<<< MUDANÇA AQUI: de @master para @v0.1.0
        id: snake-gif
        with:
          github_user_name: WesleyAssiss # Seu nome de usuário do GitHub
          outputs: dist/github-contribution-grid-snake.svg # <<<<<<<<<<<<<< MUDANÇA AQUI: Volta a usar 'outputs' e especifica o caminho direto

      # Este passo renomeia a cobrinha circular e a cobrinha escura.
      # Ele copia o SVG gerado para os nomes de arquivo que você espera no README.md.
      - name: Create themed snake files
        run: |
          # A ação Platane/snk já gera o arquivo na dist/ por padrão
          # Agora, vamos copiar esse arquivo para os nomes específicos que você usa no README.md
          cp dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg
          cp dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake.circular.svg
        # Certifica-se de que a pasta 'dist' exista antes de copiar
        # Isso é crucial se a ação anterior não a criar ou se falhar antes.
        working-directory: dist
        # Se a pasta 'dist' não existir, este comando pode falhar.
        # Uma alternativa mais robusta seria:
        # run: |
        #   mkdir -p dist
        #   mv github-contribution-grid-snake.svg dist/github-contribution-grid-snake.svg
        #   cp dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg
        #   cp dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake.circular.svg


      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output # A branch onde a cobrinha será salva
          build_dir: dist       # O diretório que contém os arquivos gerados
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
